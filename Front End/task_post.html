<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post New Task | Renovation Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="homeowner_dashboard.html">
                <span class="h4 mb-0">🛠️ Renovation Connect</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="homeowner_dashboard.html">My Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active btn btn-accent fw-bold" href="#">Post New Task</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">
                <h1 class="mb-4 text-primary">Post a New Renovation Task 📝</h1>
                <p class="lead text-secondary">Provide details about your project to get competitive bids from skilled workers.</p>
                <hr>

                <div class="card p-4 shadow-lg border-0">
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-7">
                                <label for="taskTitle" class="form-label fw-bold">Task Title (e.g., Install new kitchen sink)</label>
                                <input type="text" class="form-control" id="taskTitle" required>
                            </div>
                            <div class="col-md-5">
                                <label for="taskCategory" class="form-label fw-bold">Select Service Category</label>
                                <select class="form-select" id="taskCategory" required>
                                    <option selected disabled value="">Choose...</option>
                                    <option>Plumbing</option>
                                    <option>Electrical</option>
                                    <option>Tiling</option>
                                    <option>Painting (Interior/Exterior)</option>
                                    <option>Carpentry</option>
                                    <option>General Labour</option>
                                    <option>Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="taskDescription" class="form-label fw-bold">Detailed Task Description</label>
                            <textarea class="form-control" id="taskDescription" rows="5" placeholder="Describe the scope of work, materials needed (who provides them), and any specific constraints or deadlines." required></textarea>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="taskLocation" class="form-label fw-bold">Project Location (City/Area)</label>
                                <input type="text" class="form-control" id="taskLocation" placeholder="e.g., Lahore, DHA Phase 5" required>
                            </div>
                            <div class="col-md-6">
                                <label for="budgetRange" class="form-label fw-bold">Estimated Budget Range (Optional)</label>
                                <input type="text" class="form-control" id="budgetRange" placeholder="e.g., $500 - $800">
                                <div class="form-text">Helps workers determine bid viability.</div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                            Post Task & Start Receiving Bids
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
