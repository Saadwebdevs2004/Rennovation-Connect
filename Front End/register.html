<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renovation Connect | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <span class="h4 mb-0">🛠️ Renovation Connect</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="register.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-accent fw-bold" href="index.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-5 shadow-lg border-0">
                    <h2 class="card-title text-center mb-4 text-primary">Join Our Platform</h2>
                    <p class="text-center text-muted">Register as a <span class="fw-bold">Homeowner</span> to post tasks or as a <span class="fw-bold">Worker</span> to find jobs.</p>

                    <form>
                        <div class="mb-4 p-3 border rounded bg-light">
                            <label class="form-label d-block fw-bold text-dark mb-2">Select Your Role:</label>
                            <div class="d-flex justify-content-around">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="userRole" id="roleHomeowner" value="homeowner" required>
                                    <label class="form-check-label fw-bold" for="roleHomeowner">🏡 Homeowner</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="userRole" id="roleWorker" value="worker">
                                    <label class="form-check-label fw-bold" for="roleWorker">🛠️ Skilled Worker</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Create Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3 fw-bold">Create Account</button>
                        
                        <div class="text-center">
                            <a href="index.html" class="text-decoration-none text-muted">Already have an account? Log in.</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
