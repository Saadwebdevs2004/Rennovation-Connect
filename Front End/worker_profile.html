<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Renovation Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="worker_dashboard.html">
                <span class="h4 mb-0">🛠️ Renovation Connect</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="worker_dashboard.html">My Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" href="worker_profile.html">My Profile</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-accent text-dark fw-bold" href="index.html">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card text-center p-4 shadow-sm mb-4">
                    <div class="mb-3">
                        <img src="https://via.placeholder.com/150" class="rounded-circle img-fluid border border-3 border-primary" alt="Profile Picture">
                    </div>
                    <h4 class="mb-1">Ali Khan</h4>
                    <p class="text-muted mb-3">Professional Plumber</p>
                    <span class="badge bg-success fs-6 mb-3">⭐ 4.8 Rating</span>
                    <button class="btn btn-outline-primary w-100">Change Photo</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4 shadow-sm">
                    <h3 class="text-primary mb-4">Edit Profile Details</h3>
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control" value="Ali Khan">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Phone Number</label>
                                <input type="tel" class="form-control" value="+92 300 1234567">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Your Skills (Select all that apply)</label>
                            <div class="p-3 border rounded bg-light">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="skill1" checked>
                                    <label class="form-check-label" for="skill1">Plumbing</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="skill2">
                                    <label class="form-check-label" for="skill2">Electrical</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="skill3">
                                    <label class="form-check-label" for="skill3">Carpentry</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="skill4">
                                    <label class="form-check-label" for="skill4">Painting</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Experience / Bio</label>
                            <textarea class="form-control" rows="4">I have over 5 years of experience in residential plumbing. I specialize in leak repairs and pipe installation.</textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg fw-bold">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
