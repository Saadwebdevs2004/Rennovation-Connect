<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homeowner Profile | Renovation Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="homeowner_dashboard.html">
                <span class="h4 mb-0">🛠️ Renovation Connect</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="homeowner_dashboard.html">My Dashboard</a></li>
                     <li class="nav-item"><a class="nav-link active fw-bold" href="homeowner_profile.html">My Profile</a></li>
                    <li class="nav-item"><a class="nav-link btn btn-accent text-dark fw-bold ms-2" href="post_task.html">Post New Task</a></li>
                    <li class="nav-item"><a class="nav-link ms-2" href="index.html">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow-lg border-0">
                    <h2 class="text-primary mb-4">My Account Settings</h2>
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" class="form-control" value="Mr. Homeowner">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" value="homeowner@example.com" readonly>
                            <div class="form-text">Contact support to change your email.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" value="+92 321 7654321">
                        </div>
                        <hr>
                        <h5 class="mb-3">Change Password</h5>
                        <div class="mb-3">
                            <input type="password" class="form-control" placeholder="New Password">
                        </div>
                        <div class="mb-4">
                            <input type="password" class="form-control" placeholder="Confirm New Password">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Update Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
